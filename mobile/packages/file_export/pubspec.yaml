name: file_export
description: Ente-owned system file export for mobile and desktop

resolution: workspace
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.ente.file_export
        pluginClass: FileExportPlugin
      ios:
        pluginClass: FileExportPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: FileExportPlugin
      macos:
        pluginClass: FileExportPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FileExportPluginCApi
