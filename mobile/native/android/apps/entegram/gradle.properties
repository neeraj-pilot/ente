org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Local/dev builds can override the Museum base URL and APK shape:
# ./gradlew :app:assembleRelease -PentegramApiBaseUrl=http://<lan-ip>:8080 -PentegramAbiFilters=arm64-v8a -PentegramUniversalApk=false

# Release signing — override in ~/.gradle/gradle.properties or CI env vars.
# These are placeholder dev-only values; real keystore is NOT checked in.
ENTEGRAM_RELEASE_STORE_FILE=release.jks
ENTEGRAM_RELEASE_STORE_PASSWORD=placeholder
ENTEGRAM_RELEASE_KEY_ALIAS=entegram
ENTEGRAM_RELEASE_KEY_PASSWORD=placeholder
