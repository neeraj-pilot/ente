plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def authVersion = (file('../../pubspec.yaml').text =~ /(?m)^version: ([^+]+)\+(\d+)$/)
assert authVersion.find(): 'Auth pubspec must contain a version and build number'
def phoneBuild = authVersion.group(2).toInteger()
assert phoneBuild > 0 && phoneBuild < 1000000000
def keystoreProperties = new Properties()
def keystoreFile = file('../../android/key.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
def localKeyPath = keystoreProperties.getProperty('storeFile')

android {
    namespace 'io.ente.auth.watch.app'
    compileSdk 36
    defaultConfig {
        applicationId 'io.ente.auth'
        minSdk 30
        targetSdk 36
        // Play requires codes to be unique across the phone and watch form factors.
        versionCode 1000000000 + phoneBuild
        versionName authVersion.group(1)
    }
    signingConfigs {
        release {
            storeFile localKeyPath ? (new File(localKeyPath).isAbsolute() ? file(localKeyPath) : file('../../android/app/' + localKeyPath)) :
                System.getenv('SIGNING_KEY_PATH') ? file(System.getenv('SIGNING_KEY_PATH')) : null
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv('SIGNING_KEY_ALIAS')
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv('SIGNING_KEY_PASSWORD')
            storePassword keystoreProperties['storePassword'] ?: System.getenv('SIGNING_STORE_PASSWORD')
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies { implementation project(':auth-native') }
