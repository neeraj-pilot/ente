[package]
name = "ente-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "ente_ffi"

[dependencies]
base64 = "0.22"
blurhash = "0.2"
ente-accounts = { path = "../accounts" }
ente-core = { path = "../core", features = ["srp"] }
ente-wall = { path = "../wall" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "pnm", "qoi", "hdr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
uniffi = { version = "0.29" }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[features]
# Enables the `uniffi-bindgen` binary target (used by the XCFramework build
# script to generate Swift bindings from the built library).
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]
