name: "Build (Native components)"

on:
    pull_request:
        paths:
            - ".github/workflows/native-components.yml"
            - "android/apps/ensu/gradle/wrapper/**"
            - "android/apps/ensu/gradlew"
            - "android/packages/components/**"
            - "apple/packages/EnteComponents/**"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Check Android components
              working-directory: android/packages/components
              run: ../../apps/ensu/gradlew lintDebug :example:assembleDebug

    ios:
        runs-on: macos-26
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Check formatting
              working-directory: apple/packages/EnteComponents
              run: swift format lint --configuration .swift-format --recursive --strict Sources example/Sources
            - name: Build catalog
              working-directory: apple/packages/EnteComponents/example
              run: xcodebuild -project EnteComponentsCatalog.xcodeproj -scheme EnteComponentsCatalog -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
