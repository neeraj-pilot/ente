name: "Release (photos offline)"

on:
    workflow_dispatch:
    push:
        tags:
            - "photos-offline-v*"
        branches:
            - "**"

env:
    FLUTTER_VERSION: "3.32.8"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: mobile/apps/photos

        steps:
            - name: Checkout code and submodules
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Derive artifact suffix
              run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

            - name: Free up disk space
              run: |
                  echo "Initial disk usage:"
                  df -h /
                  INITIAL=$(df / | awk 'NR==2 {print $4}')

                  echo -e "\n=== Removing .NET SDK (~20-25GB) ==="
                  BEFORE=$(df / | awk 'NR==2 {print $4}')
                  START=$(date +%s)
                  sudo rm -rf /usr/share/dotnet
                  END=$(date +%s)
                  AFTER=$(df / | awk 'NR==2 {print $4}')
                  FREED=$(( (AFTER - BEFORE) / 1048576 ))
                  echo "Time: $((END-START))s | Freed: ${FREED}GB"

                  echo -e "\n=== Removing cached tools (~5-10GB) ==="
                  BEFORE=$(df / | awk 'NR==2 {print $4}')
                  START=$(date +%s)
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"
                  END=$(date +%s)
                  AFTER=$(df / | awk 'NR==2 {print $4}')
                  FREED=$(( (AFTER - BEFORE) / 1048576 ))
                  echo "Time: $((END-START))s | Freed: ${FREED}GB"

                  echo -e "\n=== Final Summary ==="
                  FINAL=$(df / | awk 'NR==2 {print $4}')
                  TOTAL_FREED=$(( (FINAL - INITIAL) / 1048576 ))
                  echo "Total space freed: ${TOTAL_FREED}GB"
                  echo "Final disk usage:"
                  df -h /

            - name: Setup JDK 17
              uses: actions/setup-java@v1
              with:
                  java-version: 17

            - name: Install Flutter ${{ env.FLUTTER_VERSION }}
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  flutter-version: ${{ env.FLUTTER_VERSION }}
                  cache: true

            - name: Install Flutter Rust Bridge
              run: cargo install flutter_rust_bridge_codegen

            - name: Generate Rust bindings (Core)
              run: flutter_rust_bridge_codegen generate
              working-directory: mobile/packages/rust

            - name: Generate Rust bindings
              run: flutter_rust_bridge_codegen generate

            - name: Setup keys
              uses: timheuer/base64-to-file@v1
              with:
                  fileName: "keystore/ente_photos_offline_key.jks"
                  encodedString: ${{ secrets.SIGNING_KEY_PHOTOS_OFFLINE }}

            - name: Build offline APK
              run: |
                  flutter build apk --dart-define=IS_LOCAL_ONLY_DEMO=true --dart-define=cronetHttpNoPlay=true --release --flavor offline
                  mv build/app/outputs/flutter-apk/app-offline-release.apk build/app/outputs/flutter-apk/ente-${{ env.ARTIFACT_SUFFIX }}-offline.apk
              env:
                  SIGNING_KEY_PATH: "/home/runner/work/_temp/keystore/ente_photos_offline_key.jks"
                  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS_PHOTOS_OFFLINE }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD_PHOTOS_OFFLINE }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD_PHOTOS_OFFLINE }}

            - name: Checksum
              run: sha256sum build/app/outputs/flutter-apk/ente-${{ env.ARTIFACT_SUFFIX }}-offline.apk > build/app/outputs/flutter-apk/sha256sum

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ente-${{ env.ARTIFACT_SUFFIX }}-offline
                  path: |
                      mobile/apps/photos/build/app/outputs/flutter-apk/ente-${{ env.ARTIFACT_SUFFIX }}-offline.apk
                      mobile/apps/photos/build/app/outputs/flutter-apk/sha256sum

            - name: Create a draft GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              uses: ncipollo/release-action@v1
              with:
                  artifacts: "mobile/apps/photos/build/app/outputs/flutter-apk/ente-${{ env.ARTIFACT_SUFFIX }}-offline.apk,mobile/apps/photos/build/app/outputs/flutter-apk/sha256sum"
                  draft: true
