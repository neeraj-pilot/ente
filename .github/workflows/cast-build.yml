name: "Build (Cast)"

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cast-build
    cancel-in-progress: false

jobs:
    release:
        runs-on: macos-26
        environment:
            name: production

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Prepare build metadata
              id: metadata
              working-directory: apple/apps/cast
              run: |
                  settings="$(xcodebuild -showBuildSettings -project Cast.xcodeproj -scheme Cast -configuration Release)"
                  version="$(awk '$1 == "MARKETING_VERSION" { print $3; exit }' <<< "${settings}")"
                  build_base="$(awk '$1 == "CURRENT_PROJECT_VERSION" { print $3; exit }' <<< "${settings}")"
                  if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                      echo "::error::MARKETING_VERSION must be x.y or x.y.z"
                      exit 1
                  fi
                  if [[ ! "${build_base}" =~ ^[0-9]+$ ]]; then
                      echo "::error::CURRENT_PROJECT_VERSION must be an integer"
                      exit 1
                  fi
                  if [[ "${GITHUB_REF_NAME}" == release/cast-v* ]]; then
                      if [[ "${GITHUB_REF_NAME}" != "release/cast-v${version}" ]]; then
                          echo "::error::${GITHUB_REF_NAME} does not match Cast version ${version}"
                          exit 1
                      fi
                      build_number="${build_base}"
                  elif [[ "${GITHUB_REF_NAME}" == main ]]; then
                      build_number="$((build_base + GITHUB_RUN_NUMBER))"
                  else
                      echo "::error::Cast builds must run from main or release/cast-v${version}"
                      exit 1
                  fi
                  echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"

            - name: Generate Cast bindings
              working-directory: rust
              run: cargo codegen native cast

            - name: Import Apple Distribution certificate
              uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
              with:
                  p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
                  p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

            - name: Archive and upload Cast to TestFlight
              working-directory: apple/apps/cast
              env:
                  ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
                  ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
              run: |
                  key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
                  printf '%s' "${ASC_API_KEY_BASE64}" | base64 --decode > "${key_path}"

                  xcodebuild archive \
                      -project Cast.xcodeproj \
                      -scheme Cast \
                      -configuration Release \
                      -destination 'generic/platform=tvOS' \
                      -archivePath build/Cast.xcarchive \
                      -allowProvisioningUpdates \
                      -authenticationKeyPath "${key_path}" \
                      -authenticationKeyID "${ASC_KEY_ID}" \
                      -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
                      CODE_SIGN_STYLE=Manual \
                      CODE_SIGN_IDENTITY="Apple Distribution" \
                      DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
                      PROVISIONING_PROFILE_SPECIFIER="Cast App Store" \
                      CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

                  xcodebuild -exportArchive \
                      -archivePath build/Cast.xcarchive \
                      -exportPath build/Export \
                      -exportOptionsPlist scripts/ExportOptions-AppStore-CI.plist \
                      -allowProvisioningUpdates \
                      -authenticationKeyPath "${key_path}" \
                      -authenticationKeyID "${ASC_KEY_ID}" \
                      -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
